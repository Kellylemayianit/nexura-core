name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ramp-state-machine-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cd x/ramp/types && go test -v fsm.go fsm_test.go
